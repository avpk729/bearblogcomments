<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Guestbook · Moderation</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        margin: 0; padding: 2rem 1rem 4rem; background: #fff; color: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) { body { background: #16161a; color: #e8e8ea; } }
      .wrap { max-width: 720px; margin: 0 auto; }
      h1 { margin-top: 0; }
      input, textarea, button {
        font: inherit; color: inherit; background: transparent;
      }
      .token-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
      .token-bar input {
        flex: 1; min-width: 220px; padding: 0.5rem; border: 1px solid #ccc; border-radius: 8px;
      }
      button {
        cursor: pointer; padding: 0.45rem 0.9rem; border: 1px solid currentColor;
        border-radius: 8px;
      }
      button:hover { opacity: 0.75; }
      .note {
        border: 1px solid rgba(128,128,128,0.3); border-radius: 10px;
        padding: 0.9rem; margin-bottom: 0.9rem;
      }
      .note.hidden { opacity: 0.5; }
      .note.reply { margin-left: 1.5rem; border-style: dashed; }
      .meta { font-size: 0.9rem; margin-bottom: 0.4rem; }
      .author { font-weight: 600; }
      .tag { font-size: 0.7rem; border: 1px solid currentColor; border-radius: 999px; padding: 0.05rem 0.4rem; margin-left: 0.4rem; opacity: 0.7; }
      .time { opacity: 0.55; margin-left: 0.4rem; font-size: 0.85rem; }
      .text { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; margin-bottom: 0.5rem; }
      .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .actions button { padding: 0.3rem 0.7rem; font-size: 0.85rem; border-radius: 999px; }
      .danger { color: #c0392b; }
      .reply-box { margin-top: 0.6rem; display: none; gap: 0.5rem; }
      .reply-box textarea { width: 100%; min-height: 3rem; padding: 0.5rem; border: 1px solid #ccc; border-radius: 8px; }
      .msg { font-size: 0.9rem; margin: 0.5rem 0; }
      .msg.err { color: #c0392b; }
      .msg.ok { color: #197a19; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Guestbook · Moderation</h1>
      <div class="token-bar">
        <input id="token" type="password" placeholder="Admin token" />
        <button id="save">Load</button>
        <button id="logout">Forget token</button>
      </div>
      <div id="msg" class="msg"></div>
      <div id="list"></div>
    </div>

    <script>
      var tokenInput = document.getElementById('token');
      var list = document.getElementById('list');
      var msg = document.getElementById('msg');

      var saved = localStorage.getItem('gbk_admin_token');
      if (saved) tokenInput.value = saved;

      function token() { return tokenInput.value.trim(); }
      function show(text, ok) {
        msg.className = 'msg ' + (ok ? 'ok' : 'err');
        msg.textContent = text || '';
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function api(path, opts) {
        opts = opts || {};
        opts.headers = Object.assign({ 'X-Admin-Token': token() }, opts.headers || {});
        return fetch(path, opts).then(function (r) {
          return r.json().then(function (b) {
            if (!r.ok) throw new Error(b && b.error ? b.error : 'Request failed');
            return b;
          });
        });
      }

      function flatten(notes) {
        var out = [];
        notes.forEach(function (n) {
          out.push({ note: n, isReply: false });
          (n.replies || []).forEach(function (r) {
            out.push({ note: r, isReply: true });
          });
        });
        return out;
      }

      function row(item) {
        var n = item.note;
        return (
          '<div class="note ' + (n.hidden ? 'hidden ' : '') + (item.isReply ? 'reply' : '') +
          '" data-id="' + n.id + '">' +
          '<div class="meta"><span class="author">' + esc(n.name) + '</span>' +
          (n.is_owner ? '<span class="tag">owner</span>' : '') +
          (n.hidden ? '<span class="tag">hidden</span>' : '') +
          '<span class="time">' + new Date(n.created_at).toLocaleString() + '</span></div>' +
          '<div class="text">' + esc(n.body) + '</div>' +
          '<div class="actions">' +
          '<button data-act="reply" data-id="' + n.id + '">Reply</button>' +
          (n.hidden
            ? '<button data-act="restore" data-id="' + n.id + '">Restore</button>'
            : '<button data-act="hide" data-id="' + n.id + '">Hide</button>') +
          '<button class="danger" data-act="purge" data-id="' + n.id + '">Delete</button>' +
          '</div>' +
          '<div class="reply-box" data-id="' + n.id + '">' +
          '<textarea placeholder="Reply as owner…"></textarea>' +
          '<button data-act="send-reply" data-id="' + n.id + '">Send reply</button>' +
          '</div>' +
          '</div>'
        );
      }

      function load() {
        if (!token()) { show('Enter your admin token.', false); return; }
        api('/api/admin/notes')
          .then(function (data) {
            var items = flatten(data.notes || []);
            list.innerHTML = items.length
              ? items.map(row).join('')
              : '<p>No notes yet.</p>';
            show('Loaded ' + items.length + ' notes.', true);
          })
          .catch(function (e) { show(e.message, false); });
      }

      list.addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-act]');
        if (!btn) return;
        var id = btn.getAttribute('data-id');
        var act = btn.getAttribute('data-act');

        if (act === 'reply') {
          var box = list.querySelector('.reply-box[data-id="' + id + '"]');
          box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
          return;
        }
        if (act === 'send-reply') {
          var ta = list.querySelector('.reply-box[data-id="' + id + '"] textarea');
          api('/api/admin/notes/' + id + '/reply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ body: ta.value }),
          }).then(load).catch(function (e) { show(e.message, false); });
          return;
        }
        if (act === 'hide') {
          api('/api/admin/notes/' + id, { method: 'DELETE' }).then(load).catch(function (e) { show(e.message, false); });
          return;
        }
        if (act === 'restore') {
          api('/api/admin/notes/' + id + '/restore', { method: 'POST' }).then(load).catch(function (e) { show(e.message, false); });
          return;
        }
        if (act === 'purge') {
          if (!confirm('Permanently delete this note (and its replies)? This cannot be undone.')) return;
          api('/api/admin/notes/' + id + '/purge', { method: 'DELETE' }).then(load).catch(function (e) { show(e.message, false); });
          return;
        }
      });

      document.getElementById('save').addEventListener('click', function () {
        localStorage.setItem('gbk_admin_token', token());
        load();
      });
      document.getElementById('logout').addEventListener('click', function () {
        localStorage.removeItem('gbk_admin_token');
        tokenInput.value = '';
        list.innerHTML = '';
        show('Token forgotten.', true);
      });

      if (saved) load();
    </script>
  </body>
</html>
